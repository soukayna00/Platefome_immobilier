name: atba

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: atba
      POSTGRES_USER: atba
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définis POSTGRES_PASSWORD dans .env}
    volumes:
      - atba_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atba -d atba"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: atba-backend:dev
    volumes:
      - ./Backend:/var/www/html
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: atba
      DB_USERNAME: atba
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Définis POSTGRES_PASSWORD dans .env}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: atba-frontend:dev
    working_dir: /app
    volumes:
      - ./Fontend:/app
    command: npm run dev -- --host 0.0.0.0

  nginx:
    image: nginx:stable-alpine
    ports:
      - "8082:80"
    volumes:
      - ./Nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  atba_postgres_data: